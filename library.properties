sentence=Combines arduino-mqtt + PubSubClient: QoS 0/1/2, streaming publish, persistent session, retain, will, TLS for ESP8266/ESP32.
paragraph=AViShaMQTT combines the advanced MQTT features from arduino-mqtt (QoS 0/1/2, Retain, Will, Persistent Session) with the ease-of-use patterns from PubSubClient (streaming publish, custom buffer) into one library for ESP8266 and ESP32. Features include auto-reconnect WiFi + MQTT, subscription restore, TLS support, binary payloads, and PubSubClient-compatible state codes. Bundled — zero extra dependencies.
