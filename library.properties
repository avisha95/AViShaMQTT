sentence=MQTT library for ESP8266/ESP32 with auto-reconnect, state tracking, and bundled arduino-mqtt.
paragraph=AViShaMQTT is a wrapper library for ESP8266 and ESP32 that simplifies MQTT communication. It supports publish, subscribe, Retain, QoS, Last Will, binary payloads, and TLS. Features include non-blocking connection with timeout, automatic WiFi and MQTT reconnection, and detailed connection state codes. The library comes bundled with arduino-mqtt (256dpi) — no additional dependencies required.
